[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-lab"
version = "0.1.0"
description = "Simulation-first energy flexibility research prototype"
requires-python = ">=3.11"
dependencies = [
  "pyomo>=6.10,<7",
  "highspy>=1.15,<2",
  "scikit-learn>=1.9,<2",
  "fastapi>=0.161,<1",
  "uvicorn>=0.54,<1",
  "python-multipart>=0.0.32,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
